# Project-wide Gradle settings.
# Packaging the ArkUI-X and embedded Python host needs a larger heap.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m
# Keep native/Python packaging concurrency bounded.
org.gradle.workers.max=2
# AndroidX package structure.
android.useAndroidX=true
# Only keep the module(s) present in the project.
android.nonTransitiveRClass=true
# Kotlin code style for new modules.
kotlin.code.style=official
# Disable the Kotlin compiler daemon so it runs in-process (less memory).
kotlin.compiler.execution.strategy=in-process
